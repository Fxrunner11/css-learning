<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex content practice</title>
    <style>
        * {margin:0; padding:0;}
        #heading{text-align:center;}
        .box {
            margin:5px;
            height:100px;
            width:100px;
            border:3px solid black;
        }
        #container{
            height:800px;
            width:500px;
            margin:5px;
            padding:5px;
            border:3px solid black;
            
            display:flex;
            flex-direction:row;
            justify-items:center;
            align-items:center;
            flex-wrap:wrap;
            align-content:center;
        }

        #box1{background-color:aqua;}
        #box2{background-color:lightpink}
        #box3 {background-color:lightgreen}
        #box4 {background-color:lightsalmon}
        #box5 {background-color:lightyellow;}
        #box6 {background-color:lightblue}
        #box7 {background-color:lightgray}
    </style>
</head>
<body>
    <h1 id="heading">flex container</h1>
    <div id="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>
        <div id="box5" class="box">box5</div>
        <div id="box6" class="box">box6</div>
        <div id="box7" class="box">box7</div>
    </div>
</body>
</html>
