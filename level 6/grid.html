<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid practice</title>
    <style> 
        * {margin:0; padding:0;}
        #heading {text-align:center;} 
        /*.box {margin:5px; height:100px; width:100px; border:3px solid black;}*/
        #container {height:500px; width:500px; margin:5px; padding:5px; border:3px solid black;

          display:grid;
          grid-template-columns: 100px 100px;
          grid-template-rows: 100px 100px;
        }
       #box1{background-color: aqua; grid-row:2/2; grid-column:1/2}
       #box2{background-color: lightpink; grid-row:1/2; grid-column:2/2}
       #box3 {background-color: lightgreen; grid-row:1/2; grid-column:1/2}
       #box4 {background-color: lightsalmon; grid-row:2/2; grid-column:2/2;}
    </style>
</head>
<body>
    <h1 id="heading">Grid container</h1> 
    <div id="container"> 
        <div id="box1" class="box">box1</div> 
        <div id="box2" class="box">box2</div> 
        <div id="box3" class="box">box3</div> 
        <div id="box4" class="box">box4</div> 
    </div>
</body>
</html>
