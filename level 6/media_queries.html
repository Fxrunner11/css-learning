<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Media Queries</title> 
    <style> 
        .box {padding: 5px; height: 100px; width: 100px; background-color:mediumspringgreen;}
        @media screen and (min-width: 800px) and (max-width:1000px) {
            .box {
                background-color: brown;
            }
        } 
    </style> 
</head> 
<body>
    <div class="box">box</div>
</body>
</html>
