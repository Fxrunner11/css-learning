<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css trnasform learning</title>
    <style>
        .box {
            height: 50px;  
            Width: 50px;  
            padding: 5px;  
            margin: 20px;  
            border: 1px solid black;  
            border-radius: 5px;  
            transition-property: all;  
            transition-duration: 1s;  
            transition-timing-function: ease-in-out;  
        }
        #box1 {background-color: lime;}
        #box1:hover {transform: rotate(45deg); } /*scale ma bhi same ha bas rotate ki jgh scale likhna ha aur degreeki jgh time(kitni baar) jaise 2,3,0.5 likhna ha*/
        #box2 {background-color: blueviolet;}
        #box2:hover{transform: rotate(180deg);}
        #box3 {background-color: indianred;} 
        #box3:hover {transform: rotatex(45deg);} 
        #box4 {background-color: violet } 
        #box4:hover {transform: rotatey(45deg);}

        #box5 {background-color: lime;}  
        #box5:hover {transform: translate(50px);}
        #box6 {background-color: beige;}  
        #box6:hover {transform: translate(50px, 50px);} 
        #box7 {background-color: indianred;}  
        #box7:hover {transform: translatex(50px);}
        #box8 {background-color: violet;} 
        #box8:hover {transform: translatey(50px);}

        #box9 {background-color: lime;} 
        #box9:hover {transform: skew(45deg);} 
        #box10 {background-color: blueviolet;} 
        #box10:hover { transform: skew(90deg);}

        #box11 {background-color: lime;} 
        #box11:hover {transform: scale(2);}
        #box12 {background-color: blueviolet;}  
        #box12:hover {transform: scale(4); }
        #box13 {background-color: indianred;}  
        #box13:hover {transform: scalex(2);}
        #box14 { background-color: violet;}  
        #box14:hover {transform: scaley(3);}

    </style>
</head>
<body>
    <div id="box1" class="box">45 degree</div>
    <div id="box2" class="box">180 degree</div>
    <div id="box3" class="box">x 45 deg</div>
    <div id="box4" class="box">y 45 deg</div>
    <div id="box5" class="box">translate 50px</div>
    <div id="box6" class="box">translate 50px 50px</div>
    <div id="box7" class="box">translate x 50px</div>
    <div id="box8" class="box">translate y 50px</div>
    <div id="box9" class="box">skew 45*</div>
    <div id="box10" class="box">skew 90* </div>
    <div id="box11" class="box">scale twice</div>
    <div id="box12" class="box">scale 4 times</div>
    <div id="box13" class="box">scale x twice</div>
    <div id="box14" class="box">scale y twice</div>
</body>
</html>
