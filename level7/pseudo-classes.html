<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo classes learning</title>
    <style>
        .pseudo {
            background-color:lightskyblue;
            border: 2px solid black;
            height:30px;
            width:150px;
            border-radius:10px;

            transition-property:all; /*ya transition ka topic hai*/
            transition-duration:0.5s;
            transition-timing-function: ease-in-out;
            transition-delay:0.25s;

            /* transition: all 0.5s ease-in-out 0.25s */
        }
        .pseudo:hover {
            height:40px;
            width:170px;
            background-color:aquamarine;
        }
       .pseudo:active {
            height:50px;
            width:200px;
            background-color:crimson;
       }
    </style>
</head>
<body>
    <button class="pseudo">learning pseudo</button>
</body>
</html>
